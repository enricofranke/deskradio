<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Deskradio</title>
  <desc id="desc">Internet radio for your Discord voice channel</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1020"/>
      <stop offset="0.55" stop-color="#1a1733"/>
      <stop offset="1" stop-color="#2a1a1f"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.16" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#5865f2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5865f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="0.92" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#e67e22" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e67e22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7983f5"/>
      <stop offset="1" stop-color="#5865f2"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e67e22"/>
      <stop offset="1" stop-color="#f5b041"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glowBlue)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glowOrange)"/>

  <!-- Icon: Radio mit Wellen -->
  <g transform="translate(96 92)">
    <rect x="0" y="36" width="176" height="132" rx="30" fill="url(#icon)"/>
    <line x1="44" y1="36" x2="112" y2="0" stroke="#aab1ff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="112" cy="0" r="9" fill="#aab1ff"/>
    <circle cx="62" cy="102" r="34" fill="#0f1020" fill-opacity="0.35"/>
    <circle cx="62" cy="102" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="6"/>
    <circle cx="62" cy="102" r="6" fill="#ffffff"/>
    <rect x="114" y="72" width="40" height="10" rx="5" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="114" y="96" width="40" height="10" rx="5" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="114" y="120" width="28" height="10" rx="5" fill="#ffffff" fill-opacity="0.4"/>
    <path d="M204 70 a44 44 0 0 1 0 64" fill="none" stroke="#e67e22" stroke-width="8" stroke-linecap="round"/>
    <path d="M226 50 a72 72 0 0 1 0 104" fill="none" stroke="#e67e22" stroke-opacity="0.6" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Schriftzug -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="400" y="170" fill="#ffffff" font-size="92" font-weight="800" letter-spacing="-2">Deskradio</text>
    <text x="404" y="222" fill="#c9cbe0" font-size="30" font-weight="500">Internet radio for your Discord voice channel</text>

    <g font-size="19" font-weight="600" fill="#e8e9f5">
      <rect x="404" y="252" width="168" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="488" y="278" text-anchor="middle">18 stations</text>
      <rect x="584" y="252" width="176" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="672" y="278" text-anchor="middle">Station votes</text>
      <rect x="772" y="252" width="200" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="872" y="278" text-anchor="middle">Song requests</text>
      <rect x="984" y="252" width="118" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="1043" y="278" text-anchor="middle">EN · DE</text>
    </g>
  </g>

  <!-- Equalizer -->
  <g fill="url(#bars)" transform="translate(1124 70)">
    <rect x="0" y="60" width="16" height="70" rx="8" opacity="0.55"/>
    <rect x="26" y="20" width="16" height="110" rx="8" opacity="0.8"/>
    <rect x="52" y="44" width="16" height="86" rx="8"/>
    <rect x="78" y="0" width="16" height="130" rx="8" opacity="0.9"/>
    <rect x="104" y="36" width="16" height="94" rx="8" opacity="0.65"/>
  </g>
</svg>
